<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人开销统计仪表盘</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ============== 登录/注册视图 ============== -->
  <div id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-header">
        <h1>🔐 个人开销仪表盘</h1>
        <p class="login-subtitle">请登录您的账户</p>
      </div>

      <!-- Tab 切换 -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab" type="button">登录</button>
        <button class="auth-tab" id="register-tab" type="button">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="login-form" class="auth-form">
        <div class="auth-field">
          <label for="login-username">账号</label>
          <input type="text" id="login-username" placeholder="请输入账号（3 位以上）" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <div class="auth-message" id="login-message"></div>
        <div id="login-lock-info" class="auth-lock-info" style="display: none;"></div>
        <button type="submit" class="btn btn-primary auth-submit">登 录</button>
        <div class="auth-footer">
          <span>还没有账户？</span>
          <button type="button" id="switch-to-register" class="auth-switch">去注册 →</button>
        </div>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" class="auth-form" style="display: none;">
        <div class="auth-field">
          <label for="register-username">账号</label>
          <input type="text" id="register-username" placeholder="3 位以上" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="register-password">密码</label>
          <input type="password" id="register-password" placeholder="至少 6 位" autocomplete="new-password" required>
        </div>
        <div class="auth-field">
          <label for="register-confirm">确认密码</label>
          <input type="password" id="register-confirm" placeholder="再次输入密码" autocomplete="new-password" required>
        </div>
        <div class="auth-message" id="register-message"></div>
        <button type="submit" class="btn btn-primary auth-submit">注 册</button>
        <div class="auth-footer">
          <span>已有账户？</span>
          <button type="button" id="switch-to-login" class="auth-switch">← 去登录</button>
        </div>
      </form>

      <p class="auth-hint">⚠️ 提示：连续输错 5 次密码，账号将被锁定 5 分钟</p>
    </div>
  </div>

  <!-- ============== 主仪表盘视图（登录后显示） ============== -->
  <div id="dashboard-container" class="container" style="display: none;">
    <header class="app-header">
      <div class="header-left">
        <h1>💰 个人开销统计仪表盘</h1>
        <p class="subtitle">本地存储 · 私密数据 · 登录后查看</p>
      </div>
      <div class="header-right">
        <span class="user-info" id="current-user">👤 游客</span>
        <button id="logout-btn" class="btn btn-outline btn-logout">🚪 登出</button>
      </div>
    </header>

    <!-- 录入表单 -->
    <section class="form-section">
      <h2>添加一笔开销</h2>
      <form id="expense-form" class="expense-form">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">金额 (¥)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="category">类别</label>
            <select id="category" required></select>
          </div>
          <div class="form-group">
            <label for="date">日期</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full-width">
            <label for="note">备注 (可选)</label>
            <input type="text" id="note" maxlength="100" placeholder="例如：与朋友聚餐">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">添加</button>
          <button type="button" id="add-category-btn" class="btn btn-secondary">+ 自定义类别</button>
        </div>
      </form>
    </section>

    <!-- 统计卡片 -->
    <section class="cards-section">
      <div class="card" id="card-total">
        <div class="card-label">累计总支出</div>
        <div class="card-value" id="total-amount">¥0.00</div>
      </div>
      <div class="card" id="card-month">
        <div class="card-label">本月支出</div>
        <div class="card-value" id="month-amount">¥0.00</div>
      </div>
      <div class="card" id="card-max">
        <div class="card-label">最高单笔</div>
        <div class="card-value" id="max-amount">¥0.00</div>
        <div class="card-sub" id="max-category"></div>
      </div>
    </section>

    <!-- 图表区 -->
    <section class="charts-section">
      <div class="chart-container" id="chart-pie">
        <h3>📊 类别占比（环形图）</h3>
        <div id="pie-chart"></div>
      </div>
      <div class="chart-container" id="chart-bar">
        <h3>📈 月度支出（柱状图）</h3>
        <div id="bar-chart"></div>
      </div>
      <div class="chart-container chart-full" id="chart-stack">
        <h3>🏗️ 每月各类别分布（堆叠柱状图）</h3>
        <div id="stack-chart"></div>
      </div>
      <div class="chart-container chart-full" id="chart-line">
        <h3>📉 本月支出趋势（折线图）</h3>
        <div id="line-chart"></div>
      </div>
    </section>

    <!-- 开销列表 -->
    <section class="list-section">
      <div class="list-header">
        <h2>📋 开销明细</h2>
        <div class="list-filter">
          <label>筛选：</label>
          <select id="filter-category">
            <option value="">全部</option>
          </select>
        </div>
      </div>
      <div class="expense-list" id="expense-list">
        <div class="empty-state">暂无记录</div>
      </div>
    </section>

    <!-- 数据管理 -->
    <section class="data-section">
      <h2>⚙️ 数据管理</h2>
      <div class="data-actions">
        <div class="dropdown-wrapper">
          <button id="export-dropdown" class="btn btn-outline dropdown-toggle">📤 导出 ▾</button>
          <div class="dropdown-menu" id="export-menu">
            <button type="button" class="dropdown-item" data-format="json">📄 导出为 JSON</button>
            <button type="button" class="dropdown-item" data-format="csv">📊 导出为 CSV</button>
            <button type="button" class="dropdown-item" data-format="excel">📑 导出为 Excel</button>
          </div>
        </div>
        <label class="btn btn-outline">
          📥 导入备份
          <input type="file" id="import-file" accept=".json,.csv,.xlsx,.xls" hidden>
        </label>
        <button id="clear-btn" class="btn btn-danger">🗑️ 清空所有数据</button>
      </div>
    </section>
  </div>

  <!-- ECharts CDN：jsdelivr（国际） + bootcdn（国内备用） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script>if (typeof echarts === 'undefined') { document.write('<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"><\\/script>'); }</script>

  <!-- SheetJS (xlsx) CDN：jsdelivr + bootcdn -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>if (typeof XLSX === 'undefined') { document.write('<script src="https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\\/script>'); }</script>

  <!-- 业务 JS 模块（严格按依赖顺序加载） -->
  <script src="js/auth.js"></script>            <!-- 认证模块最先（路由守卫 + 登录态检查） -->
  <script src="js/categories.js"></script>
  <script src="js/data-store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/list-view.js"></script>
  <script src="js/form.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>            <!-- main.js 最后，auth.js 暴露 onAuthReady -->
</body>
</html>
