<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人开销统计仪表盘</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>💰 个人开销统计仪表盘</h1>
      <p class="subtitle">本地存储 · 零注册 · 打开即用</p>
    </header>

    <!-- 录入表单 -->
    <section class="form-section">
      <h2>添加一笔开销</h2>
      <form id="expense-form" class="expense-form">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">金额 (¥)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="category">类别</label>
            <select id="category" required></select>
          </div>
          <div class="form-group">
            <label for="date">日期</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full-width">
            <label for="note">备注 (可选)</label>
            <input type="text" id="note" maxlength="100" placeholder="例如：与朋友聚餐">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">添加</button>
          <button type="button" id="add-category-btn" class="btn btn-secondary">+ 自定义类别</button>
        </div>
      </form>
    </section>

    <!-- 统计卡片 -->
    <section class="cards-section">
      <div class="card" id="card-total">
        <div class="card-label">累计总支出</div>
        <div class="card-value" id="total-amount">¥0.00</div>
      </div>
      <div class="card" id="card-month">
        <div class="card-label">本月支出</div>
        <div class="card-value" id="month-amount">¥0.00</div>
      </div>
      <div class="card" id="card-max">
        <div class="card-label">最高单笔</div>
        <div class="card-value" id="max-amount">¥0.00</div>
        <div class="card-sub" id="max-category"></div>
      </div>
    </section>

    <!-- 图表区 -->
    <section class="charts-section">
      <div class="chart-container" id="chart-pie">
        <h3>📊 类别占比</h3>
        <div id="pie-chart"></div>
      </div>
      <div class="chart-container" id="chart-bar">
        <h3>📈 月度支出</h3>
        <div id="bar-chart"></div>
      </div>
      <div class="chart-container chart-full" id="chart-line">
        <h3>📉 本月支出趋势</h3>
        <div id="line-chart"></div>
      </div>
    </section>

    <!-- 开销列表 -->
    <section class="list-section">
      <div class="list-header">
        <h2>📋 开销明细</h2>
        <div class="list-filter">
          <label>筛选：</label>
          <select id="filter-category">
            <option value="">全部</option>
          </select>
        </div>
      </div>
      <div class="expense-list" id="expense-list">
        <div class="empty-state">暂无记录</div>
      </div>
    </section>

    <!-- 数据管理 -->
    <section class="data-section">
      <h2>⚙️ 数据管理</h2>
      <div class="data-actions">
        <button id="export-btn" class="btn btn-outline">📤 导出备份 (JSON)</button>
        <label class="btn btn-outline">
          📥 导入备份
          <input type="file" id="import-file" accept=".json" hidden>
        </label>
        <button id="clear-btn" class="btn btn-danger">🗑️ 清空所有数据</button>
      </div>
    </section>
  </div>

  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <!-- 业务 JS 模块（按依赖顺序加载） -->
  <script src="js/categories.js"></script>
  <script src="js/data-store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/list-view.js"></script>
  <script src="js/form.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
